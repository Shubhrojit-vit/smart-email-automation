<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Logs - Smart Email Automation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "border-subtle": "#e2e8f0",
                        "surface-container-high": "#e6e8ea",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "surface-tint": "#005ac2",
                        "outline-variant": "#c2c6d6",
                        "secondary-container": "#d5e0f8",
                        "on-primary-container": "#fefcff",
                        "primary-container": "#2170e4",
                        "surface-dim": "#d8dadc",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#424754",
                        "sidebar-text": "#f1f5f9",
                        "secondary": "#545f73",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eceef0",
                        "text-primary": "#0f172a",
                        "primary": "#0058be",
                        "surface": "#f7f9fb",
                        "on-background": "#191c1e",
                        "outline": "#727785",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "text-secondary": "#64748b",
                        "on-secondary-container": "#586377",
                        "on-primary-fixed-variant": "#004395",
                        "tertiary-container": "#b75b00",
                        "success": "#10b981"
                    },
                    spacing: {
                        "gutter": "24px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "sidebar-width": "240px",
                        "container-padding": "32px"
                    },
                    fontFamily: {
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "sidebar-nav": ["Inter"]
                    },
                    fontSize: {
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "sidebar-nav": ["14px", { lineHeight: "20px", fontWeight: "500" }]
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-background text-on-surface font-body-md h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-[240px] bg-inverse-surface text-sidebar-text flex flex-col h-full shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-sidebar-text/10">
            <span class="material-symbols-outlined text-primary-container mr-2">mail</span>
            <span class="font-headline-md text-lg font-bold">SmartEmail</span>
        </div>
        <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
            <a href="index.html" class="flex items-center px-3 py-2 rounded-md hover:bg-sidebar-text/10 transition-colors font-sidebar-nav">
                <span class="material-symbols-outlined mr-3 text-xl">dashboard</span>
                Dashboard
            </a>
            <a href="compose.html" class="flex items-center px-3 py-2 rounded-md hover:bg-sidebar-text/10 transition-colors font-sidebar-nav mt-1">
                <span class="material-symbols-outlined mr-3 text-xl">edit_note</span>
                Compose Email
            </a>
            <a href="recipients.html" class="flex items-center px-3 py-2 rounded-md hover:bg-sidebar-text/10 transition-colors font-sidebar-nav mt-1">
                <span class="material-symbols-outlined mr-3 text-xl">group</span>
                Recipients
            </a>
            <a href="schedule.html" class="flex items-center px-3 py-2 rounded-md hover:bg-sidebar-text/10 transition-colors font-sidebar-nav mt-1">
                <span class="material-symbols-outlined mr-3 text-xl">schedule</span>
                Schedule
            </a>
            <a href="logs.html" class="flex items-center px-3 py-2 rounded-md bg-primary text-on-primary font-sidebar-nav mt-1">
                <span class="material-symbols-outlined mr-3 text-xl">history</span>
                Logs
            </a>
            <a href="settings.html" class="flex items-center px-3 py-2 rounded-md hover:bg-sidebar-text/10 transition-colors font-sidebar-nav mt-1">
                <span class="material-symbols-outlined mr-3 text-xl">settings</span>
                Settings
            </a>
        </nav>
        <div class="p-4 border-t border-sidebar-text/10">
            <a href="compose.html" class="flex items-center justify-center w-full py-2 bg-primary hover:bg-primary/90 text-on-primary rounded-md transition-colors font-sidebar-nav">
                <span class="material-symbols-outlined mr-2 text-xl">add</span>
                New Campaign
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-border-subtle flex items-center px-8 shrink-0">
            <h2 class="font-headline-lg text-xl text-text-primary">Email Logs</h2>
        </header>

        <!-- Main workspace -->
        <main class="flex-1 overflow-auto p-8">
            <div class="max-w-6xl mx-auto space-y-6">
                <!-- Top controls -->
                <div class="flex justify-between items-center bg-white p-4 border border-border-subtle rounded-t-lg shadow-sm">
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-400">search</span>
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search logs by name or email..." class="pl-10 pr-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-80">
                    </div>
                    <button onclick="exportLogs()" class="bg-primary text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-blue-700 transition-colors font-medium">
                        <span class="material-symbols-outlined">download</span>
                        Export Report
                    </button>
                </div>

                <!-- Table -->
                <div class="bg-white border border-border-subtle border-t-0 rounded-b-lg shadow-sm overflow-hidden -mt-6">
                    <table class="w-full text-left border-collapse mt-6">
                        <thead class="bg-surface-container-low text-text-secondary text-sm uppercase">
                            <tr>
                                <th class="py-3 px-6 font-semibold">Name</th>
                                <th class="py-3 px-6 font-semibold">Email</th>
                                <th class="py-3 px-6 font-semibold">Status</th>
                                <th class="py-3 px-6 font-semibold">Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody" class="divide-y divide-border-subtle">
                            <tr>
                                <td colspan="4" class="py-12 text-center text-text-secondary">No email logs yet</td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <!-- Pagination -->
                    <div class="px-6 py-3 flex items-center justify-between border-t border-border-subtle bg-gray-50">
                        <span class="text-sm text-text-secondary" id="paginationInfo">Showing 0 to 0 of 0 entries</span>
                        <div class="flex gap-2">
                            <button class="px-3 py-1 border border-gray-300 rounded text-sm text-text-primary hover:bg-gray-100 disabled:opacity-50" disabled>Previous</button>
                            <button class="px-3 py-1 border border-gray-300 rounded text-sm text-text-primary hover:bg-gray-100 disabled:opacity-50" disabled>Next</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allLogs = [];

        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                if (response.ok) {
                    const data = await response.json();
                    allLogs = data.logs || [];
                    renderTable();
                } else {
                    console.log("No logs found or error fetching.");
                }
            } catch (error) {
                console.error('Error fetching logs:', error);
            }
        }

        function exportLogs() {
            window.open('/api/logs/export', '_blank');
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderTable(query);
        }

        function renderTable(filterQuery = '') {
            const tbody = document.getElementById('logsTableBody');
            
            const filtered = allLogs.filter(log => 
                (log.name && log.name.toLowerCase().includes(filterQuery)) || 
                (log.email && log.email.toLowerCase().includes(filterQuery))
            );

            if (filtered.length === 0) {
                tbody.innerHTML = \`<tr><td colspan="4" class="py-12 text-center text-text-secondary">\${allLogs.length === 0 ? 'No email logs yet' : 'No matching logs found.'}</td></tr>\`;
                document.getElementById('paginationInfo').textContent = \`Showing 0 to 0 of 0 entries\`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach(log => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                let statusBadge = '';
                if (log.status && log.status.toLowerCase() === 'sent') {
                    statusBadge = \`
                        <span class="inline-flex items-center gap-1 bg-green-100 text-success px-2.5 py-0.5 rounded-full text-xs font-medium">
                            <span class="material-symbols-outlined text-[14px]">check_circle</span> Sent
                        </span>
                    \`;
                } else {
                    statusBadge = \`
                        <span class="inline-flex items-center gap-1 bg-red-100 text-error px-2.5 py-0.5 rounded-full text-xs font-medium">
                            <span class="material-symbols-outlined text-[14px]">error</span> Failed
                        </span>
                    \`;
                }

                const formattedTime = log.timestamp ? new Date(log.timestamp).toLocaleString() : '-';

                tr.innerHTML = \`
                    <td class="py-3 px-6 whitespace-nowrap text-text-primary font-medium">\${log.name || '-'}</td>
                    <td class="py-3 px-6 whitespace-nowrap text-text-secondary">\${log.email || '-'}</td>
                    <td class="py-3 px-6 whitespace-nowrap">\${statusBadge}</td>
                    <td class="py-3 px-6 whitespace-nowrap text-text-secondary text-sm">\${formattedTime}</td>
                \`;
                tbody.appendChild(tr);
            });

            document.getElementById('paginationInfo').textContent = \`Showing 1 to \${filtered.length} of \${allLogs.length} entries\`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchLogs);
    </script>
</body>
</html>
